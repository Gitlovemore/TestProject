<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>汉字寻宝 - 听音解锁累计版（移动端优化版）</title>
    <style>
        :root {
            --p: #ff7e5f; --s: #feb47b; 
            --bg: #fdf6e3; --panel: #ffffff;
            --red-btn: #d32f2f; --red-btn-light: #ff5252;
            --green: #43a047; --wrong: #e53935;
            --door-bg: #4a148c;
        }

        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg);
            margin: 0; padding: 0;
            display: flex; align-items: center; justify-content: center;
            height: 100dvh; width: 100vw; overflow: hidden;
            user-select: none;
        }

        #game-stage {
            width: 95vw; max-width: 800px;
            height: 95vh; max-height: 750px;
            background: var(--panel);
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            position: relative;
            display: none; flex-direction: column;
            padding: 15px; box-sizing: border-box;
        }

        .header {
            display: flex; justify-content: space-between;
            font-size: 1.1rem; font-weight: bold; color: #444;
            padding: 5px 10px; border-bottom: 2px solid #f0f0f0;
        }

        #level-content {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            overflow: hidden; width: 100%; position: relative;
        }

        /* --- 底部 UI --- */
        .bottom-ui {
            height: 90px; display: flex; justify-content: space-between;
            align-items: flex-end; padding: 0 5px 10px 5px; pointer-events: none; 
        }

        #clue-tray {
            pointer-events: auto;
            display: flex; gap: 5px; padding: 8px;
            background: rgba(255, 126, 95, 0.05); 
            border-radius: 15px; border: 2px dashed var(--p); 
            width: 60%; height: 80px; align-items: center; overflow-x: auto;
            position: relative; transition: 0.3s;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        #clue-tray::-webkit-scrollbar { display: none; }
        #clue-tray.drag-active {
            background: rgba(255, 215, 64, 0.2);
            border-color: #ffca28;
            box-shadow: 0 0 15px rgba(255, 202, 40, 0.4);
        }
        #clue-tray::before {
            content: "收集袋"; position: absolute; top: -20px; left: 5px;
            font-size: 0.7rem; color: var(--p); font-weight: bold;
        }

        .clue-item {
            background: #fff; border: 1px solid #ffd54f;
            border-radius: 8px; padding: 4px 6px;
            display: flex; flex-direction: column; align-items: center; min-width: 36px;
        }
        .clue-pinyin { font-size: 0.6rem; color: #795548; }
        .clue-char { font-size: 1rem; font-weight: bold; }
        
        .coin-status {
            pointer-events: auto;
            background: linear-gradient(135deg, #ffd700, #ff8f00);
            padding: 10px 20px; border-radius: 30px;
            font-weight: bold; font-size: 1.2rem; color: #fff;
            box-shadow: 0 4px 0 #e65100; display: flex; align-items: center; gap: 8px;
            margin-bottom: 15px; margin-right: 5px;
            transition: transform 0.2s;
            min-height: 44px;
        }
        .coin-pop { animation: popScale 0.3s ease-out; }
        @keyframes popScale { 0%{transform:scale(1);} 50%{transform:scale(1.3);} 100%{transform:scale(1);} }

        .card {
            width: 75px; height: 75px; background: white; 
            border: 3px solid var(--s); border-radius: 15px; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 1.8rem; font-weight: bold; transition: 0.2s;
            box-shadow: 0 5px 0 #ddd; margin: 6px;
            min-height: 44px; min-width: 44px;
        }
        .card:active { transform: translateY(4px) scale(0.95); box-shadow: 0 1px 0 #ddd; }

        .arcade-box {
            width: 280px; height: 400px; background: #3949ab;
            border: 8px solid #1a237e; border-radius: 20px;
            display: flex; flex-direction: column; align-items: center; padding: 15px;
            position: relative; box-shadow: 0 8px 0 #0d47a1;
        }
        .arcade-screen {
            width: 100%; height: 160px; background: #000;
            border-radius: 10px; border: 4px solid #555;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #76ff03; font-family: monospace; font-size: 1.2rem; text-align: center;
            text-shadow: 0 0 5px #76ff03; overflow: hidden; position: relative;
        }
        .control-panel {
            width: 100%; display: flex; justify-content: space-around; 
            align-items: center; margin-top: 30px;
        }
        .coin-slot {
            width: 60px; height: 80px; background: #222;
            border: 4px solid #ffd700; border-radius: 10px;
            position: relative; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column;
        }
        .coin-slot::after {
            content: "投币口";
            position: absolute;
            bottom: -25px;
            color: #ffd700;
            font-size: 0.8rem;
            font-weight: bold;
            white-space: nowrap;
        }
        .coin-slot.active {
            border-color: #ffeb3b;
            box-shadow: 0 0 15px #ffeb3b;
            background: #333;
        }
        .start-btn {
            width: 70px; height: 70px; background: #90a4ae;
            border-radius: 50%; border: 4px solid #546e7a;
            box-shadow: 0 6px 0 #37474f; 
            display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.5); font-weight: bold; font-size: 0.9rem;
            cursor: not-allowed; transition: 0.3s;
            min-height: 44px; min-width: 44px;
        }
        .start-btn.active {
            background: var(--red-btn-light); border-color: var(--red-btn);
            box-shadow: 0 6px 0 #b71c1c; color: white; cursor: pointer; 
            animation: btnPulse 1s infinite;
        }
        @keyframes btnPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .coin-obj {
            width: 45px; height: 45px; background: radial-gradient(circle, #ffd700, #ff8f00);
            border-radius: 50%; border: 2px solid #b8860b; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #5d4037; box-shadow: 0 3px 0 #5d4037;
            position: relative;
            z-index: 10;
            transition: transform 0.2s;
        }
        .coin-obj.clicked {
            animation: coinFly 0.8s ease-out forwards;
        }
        
        @keyframes coinFly {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            50% {
                transform: translate(var(--target-x, 100px), var(--target-y, -100px)) scale(1.2);
                opacity: 0.8;
            }
            100% {
                transform: translate(var(--target-x, 100px), var(--target-y, -100px)) scale(0);
                opacity: 0;
            }
        }

        .lock-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;
            padding: 20px; background: rgba(0,0,0,0.1); border-radius: 20px;
        }
        .rune-stone {
            width: 70px; height: 70px; background: #fff;
            border: 4px solid #673ab7; color: #512da8;
            border-radius: 12px; font-size: 1.8rem; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 4px 0 #4527a0; transition: 0.2s;
            min-height: 44px; min-width: 44px;
        }
        .rune-stone:active { transform: translateY(4px) scale(0.95); box-shadow: 0 1px 0 #4527a0; }
        .rune-stone.solved {
            background: #81c784; border-color: #2e7d32; color: white;
            box-shadow: none; transform: translateY(4px); cursor: default;
        }

        .magic-world {
            width: 100%; height: 100%; background: linear-gradient(135deg, #311b92, #673ab7);
            border-radius: 20px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white; text-align: center;
        }

        #setup-screen {
            position: fixed; inset: 0; background: rgba(0,0,0,0.92);
            z-index: 1000; display: flex; align-items: center; justify-content: center;
        }
        .setup-panel { 
            background: white; padding: 30px; border-radius: 25px; 
            text-align: center; width: 85%; max-width: 350px; 
        }
        .hidden { display: none !important; }
        
        input, textarea, button {
            font-size: 16px; /* 防止iOS自动缩放 */
        }

        /* ========== 移动端自适应样式 ========== */
        /* 小屏幕手机 (竖屏) */
        @media (max-width: 480px) {
            #game-stage {
                width: 100vw;
                height: 100dvh;
                max-width: none;
                max-height: none;
                border-radius: 0;
                padding: 10px;
            }
            
            .card, .rune-stone {
                width: 65px;
                height: 65px;
                font-size: 1.5rem;
                margin: 4px;
            }
            
            .arcade-box {
                width: 95vw;
                height: 55vh;
                transform: scale(0.9);
                transform-origin: center;
            }
            
            #clue-tray {
                height: 60px;
                min-width: 70vw;
            }
            
            .header {
                font-size: 0.9rem;
                padding: 3px 5px;
            }
            
            #msg-hint {
                font-size: 0.8rem;
                max-width: 60%;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            
            .coin-status {
                font-size: 1rem;
                padding: 8px 15px;
                margin-bottom: 10px;
            }
            
            .bottom-ui {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                background: var(--panel);
                padding: 5px 10px;
                z-index: 100;
                height: auto;
            }
            
            #level-content {
                padding-bottom: 100px;
                overflow-y: auto;
            }
            
            .control-panel {
                margin-top: 20px;
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }
            
            .coin-slot {
                width: 80px;
                height: 100px;
                border-width: 6px;
                font-size: 1rem;
            }
            
            .start-btn {
                width: 70px;
                height: 70px;
                font-size: 0.9rem;
            }
            
            .coin-obj {
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
            }
            
            html {
                font-size: 14px;
            }
            
            /* 第三关移动端布局优化 */
            #level3-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
                width: 100%;
                height: 100%;
                padding-top: 10px;
                overflow-y: auto;
            }
            
            #purse-container {
                width: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                margin-bottom: 20px;
                z-index: 20;
            }
            
            #purse {
                width: 90%;
                height: 120px;
                display: flex;
                flex-wrap: wrap;
                align-content: flex-start;
                gap: 8px;
                border: 3px solid #ddd;
                border-radius: 15px;
                padding: 10px;
                overflow-y: auto;
                background: #fff;
                justify-content: center;
            }
            
            .arcade-box {
                width: 95%;
                height: 45vh;
                margin-top: 10px;
                position: relative;
                z-index: 5;
            }
            
            .coin-slot::after {
                font-size: 0.9rem;
                bottom: -30px;
            }
        }

        /* 中等屏幕手机 (横屏/小平板) */
        @media (min-width: 481px) and (max-width: 768px) {
            #game-stage {
                width: 95vw;
                height: 95vh;
                max-width: none;
            }
            
            .card, .rune-stone {
                width: 70px;
                height: 70px;
                font-size: 1.6rem;
            }
            
            .arcade-box {
                width: 85vw;
                height: 55vh;
            }
            
            #clue-tray {
                height: 70px;
            }
            
            .header {
                font-size: 1rem;
            }
            
            .coin-slot {
                width: 70px;
                height: 90px;
            }
        }

        /* 平板设备 */
        @media (min-width: 769px) and (max-width: 1024px) {
            #game-stage {
                max-width: 90vw;
                max-height: 90vh;
            }
            
            .arcade-box {
                width: 70vw;
                height: 60vh;
            }
        }

        /* 横屏模式优化 */
        @media (max-height: 500px) and (orientation: landscape) {
            #game-stage {
                flex-direction: row;
                padding: 5px;
            }
            
            .header {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                z-index: 10;
                background: var(--panel);
            }
            
            #level-content {
                margin-top: 40px;
                padding-bottom: 60px;
            }
            
            .bottom-ui {
                position: absolute;
                bottom: 0;
                width: 100%;
            }
            
            .arcade-box {
                width: 50vw;
                height: 85vh;
                margin: 0 auto;
            }
            
            .bottom-ui {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                height: auto;
                padding: 10px;
            }
            
            #clue-tray {
                width: 50%;
                height: 60px;
            }
            
            #level-content {
                padding-bottom: 80px;
            }
            
            /* 横屏时第三关布局 */
            #level3-container {
                flex-direction: row;
                justify-content: space-around;
                align-items: flex-start;
                padding-top: 20px;
            }
            
            #purse-container {
                width: 40%;
                margin-bottom: 0;
            }
            
            .arcade-box {
                width: 50%;
                height: 70vh;
            }
        }

        /* 触摸设备优化 */
        @media (hover: none) and (pointer: coarse) {
            .card, .rune-stone, .coin-obj, .start-btn, #play-btn-L4 {
                cursor: default;
                -webkit-tap-highlight-color: transparent;
            }
            
            .card:active, .rune-stone:active, .start-btn:active {
                transform: scale(0.95);
                transition: transform 0.1s;
            }
            
            .coin-slot {
                touch-action: manipulation;
            }
            
            .clue-item, .card[draggable="true"] {
                touch-action: manipulation;
            }
        }

        /* 高DPI屏幕优化 */
        @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
            .card, .rune-stone, .coin-obj {
                border-width: 2px;
            }
        }

        /* 暗色模式支持 */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a2e;
                --panel: #16213e;
                --door-bg: #311b92;
            }
            
            body {
                background-color: var(--bg);
                color: #e0e0e0;
            }
            
            #game-stage {
                background: var(--panel);
                box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            }
            
            .header {
                color: #bbbbbb;
                border-bottom-color: #2d3748;
            }
            
            .card, .rune-stone {
                background: #2d3748;
                color: #ffffff;
                border-color: #4a5568;
            }
            
            .clue-item {
                background: #2d3748;
                border-color: #4a5568;
            }
            
            #clue-tray {
                background: rgba(255, 126, 95, 0.1);
                border-color: var(--p);
            }
            
            .setup-panel {
                background: #2d3748;
                color: #e0e0e0;
            }
            
            #words-input {
                background: #4a5568;
                color: #ffffff;
                border-color: #718096;
            }
        }

        /* 防止文字过小 */
        @media (max-width: 360px) {
            html {
                font-size: 14px;
            }
            
            .card, .rune-stone {
                width: 55px;
                height: 55px;
                font-size: 1.3rem;
            }
            
            #clue-tray {
                height: 55px;
            }
            
            .clue-char {
                font-size: 0.9rem;
            }
            
            .clue-pinyin {
                font-size: 0.5rem;
            }
            
            .coin-slot {
                width: 70px;
                height: 90px;
            }
            
            .coin-slot::after {
                font-size: 0.7rem;
            }
        }

        /* 超大屏幕优化 */
        @media (min-width: 1400px) {
            #game-stage {
                max-width: 1000px;
                max-height: 800px;
            }
            
            .card, .rune-stone {
                width: 85px;
                height: 85px;
                font-size: 2rem;
            }
        }

        /* 全面屏手机适配 */
        @supports (padding: max(0px)) {
            body {
                padding-left: env(safe-area-inset-left);
                padding-right: env(safe-area-inset-right);
                padding-top: env(safe-area-inset-top);
                padding-bottom: env(safe-area-inset-bottom);
            }
            
            #game-stage {
                padding-left: max(15px, env(safe-area-inset-left));
                padding-right: max(15px, env(safe-area-inset-right));
                padding-top: max(15px, env(safe-area-inset-top));
                padding-bottom: max(15px, env(safe-area-inset-bottom));
            }
            
            .bottom-ui {
                padding-bottom: max(10px, env(safe-area-inset-bottom));
            }
        }

        /* 动画性能优化 */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* 方向特定的布局 */
        .portrait-mode .arcade-box {
            width: 90vw;
            height: 50vh;
        }

        .landscape-mode .arcade-box {
            width: 50vw;
            height: 80vh;
        }

        /* 触摸激活状态 */
        .touch-active {
            opacity: 0.7;
            transform: scale(0.95);
        }

        /* 设置页面按钮 */
        .setup-panel button {
            padding: 12px 40px;
            background: var(--p);
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            min-height: 44px;
            font-size: 16px;
        }
        
        .setup-panel button:active {
            transform: scale(0.95);
        }

        #words-input {
            width: 85%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 1rem;
        }

        /* 魔法乐园按钮 */
        .shop-btn {
            padding: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #fff;
            font-weight: bold;
            min-height: 44px;
        }
        
        .shop-btn.special {
            background: gold;
        }
        
        .shop-btn:active {
            transform: scale(0.95);
        }
        
        /* 金币投掷区域 */
        #drop-zone {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 5;
            pointer-events: none;
        }
        
        /* 第三关钱包标题 */
        .purse-title {
            font-size: 1rem;
            font-weight: bold;
            color: #444;
            margin-bottom: 8px;
            text-align: center;
        }
        
        /* 投币提示 */
        .coin-hint {
            font-size: 0.9rem;
            color: #666;
            text-align: center;
            margin-top: 10px;
            padding: 5px;
            background: #f5f5f5;
            border-radius: 10px;
            max-width: 90%;
        }
        
        /* 移动端点击收集按钮 */
        .collect-btn {
            background: linear-gradient(135deg, var(--p), var(--s));
            color: white;
            border: none;
            border-radius: 10px;
            padding: 8px 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .collect-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body id="main-body">

    <div id="setup-screen">
        <div class="setup-panel">
            <h2 style="color:var(--p)">🦁 汉字探险启动</h2>
            <p>输入要学习的汉字（用空格分隔）：</p>
            <input type="text" id="words-input" value="山 水 日 月" placeholder="例如：山 水 日 月">
            <br><br>
            <button onclick="Game.start()">出发！</button>
        </div>
    </div>

    <div id="game-stage">
        <div class="header">
            <div id="level-tag">关卡: 1/4</div>
            <div id="msg-hint" style="color: var(--p); font-size: 0.95rem;"></div>
        </div>
        <div id="level-content"></div>
        <div class="bottom-ui">
            <div id="clue-tray"></div>
            <div class="coin-status">💰 <span id="coin-val">0</span></div>
        </div>
    </div>

<script>
const PinyinDict = {
    "山":"shān","水":"shuǐ","日":"rì","月":"yuè","天":"tiān","地":"dì",
    "人":"rén","口":"kǒu","手":"shǒu","足":"zú","大":"dà","小":"xiǎo",
    "多":"duō","少":"shǎo","木":"mù","火":"huǒ","土":"tǔ","金":"jīn"
};

const AudioSys = {
    speak(t) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(t);
        u.lang = 'zh-CN'; u.rate = 0.85;
        window.speechSynthesis.speak(u);
    },
    playTone(freq, type='sine', dur=0.3) {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = type; osc.frequency.value = freq; osc.connect(g); g.connect(ctx.destination);
        osc.start(); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
        osc.stop(ctx.currentTime + dur);
    }
};

// 设备检测
const DeviceDetector = {
    isMobile: false,
    isTouchDevice: false,
    
    init() {
        this.isTouchDevice = 'ontouchstart' in window;
        this.isMobile = window.innerWidth < 768 || this.isTouchDevice;
        return this.isMobile;
    }
};

// 触摸支持模块
const TouchSupport = {
    init() {
        // 为触摸设备优化交互
        if (DeviceDetector.isTouchDevice) {
            // 添加触摸事件监听
            document.addEventListener('touchstart', this.handleTouchStart, { passive: true });
            document.addEventListener('touchend', this.handleTouchEnd, { passive: true });
            
            // 防止双击缩放
            let lastTouchEnd = 0;
            document.addEventListener('touchend', (e) => {
                const now = Date.now();
                if (now - lastTouchEnd <= 300) {
                    e.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
        }
    },
    
    handleTouchStart(e) {
        const target = e.target;
        if (target.classList.contains('card') || 
            target.classList.contains('rune-stone') ||
            target.classList.contains('start-btn') ||
            target.classList.contains('shop-btn') ||
            target.classList.contains('coin-obj')) {
            target.classList.add('touch-active');
        }
    },
    
    handleTouchEnd(e) {
        document.querySelectorAll('.touch-active').forEach(el => {
            el.classList.remove('touch-active');
        });
    }
};

// 屏幕方向检测
const ScreenOrientation = {
    isPortrait: window.innerHeight > window.innerWidth,
    
    init() {
        this.updateOrientationClass();
        window.addEventListener('resize', this.handleResize.bind(this));
        window.addEventListener('orientationchange', () => {
            setTimeout(this.handleResize.bind(this), 100);
        });
    },
    
    handleResize() {
        const newIsPortrait = window.innerHeight > window.innerWidth;
        if (newIsPortrait !== this.isPortrait) {
            this.isPortrait = newIsPortrait;
            this.updateOrientationClass();
        }
    },
    
    updateOrientationClass() {
        document.body.classList.remove('portrait-mode', 'landscape-mode');
        document.body.classList.add(this.isPortrait ? 'portrait-mode' : 'landscape-mode');
    }
};

    doDance(icon, cost) {
        if(this.coins < cost) {
            alert("金币不足！");
            return;
        }
        this.coins -= cost; 
        this.updateUI();
        const d = document.getElementById('dancer'); 
        d.textContent = icon;
        d.animate([
            {transform:'scale(1)', opacity: 1},
            {transform:'scale(1.5) rotate(360deg)', opacity: 0.8},
            {transform:'scale(1)', opacity: 1}
        ], {duration:1000, iterations: 1});
        AudioSys.playTone(1000);
    }
};

// 页面加载时初始化
window.addEventListener('DOMContentLoaded', () => {
    // 添加文字滚动动画
    const style = document.createElement('style');
    style.textContent = `
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        #msg-hint {
            white-space: nowrap;
            overflow: hidden;
        }
    `;
    document.head.appendChild(style);
    
    // 初始化屏幕方向检测
    ScreenOrientation.init();
});
</script>
</body>
</html>
